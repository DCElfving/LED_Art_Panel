# Builds the student setup program (setup_panel.py) as a double-clickable
# executable for each system. Run it from the Actions tab ("Run workflow"),
# then download the three files from the run's Artifacts and share them with
# students (see STUDENT_EMAIL.md).
#
# The Mac and Linux programs are zipped: a bare program downloaded by a
# browser (or uploaded as an artifact) loses its "executable" permission and
# won't open when double-clicked. A zip keeps it.
#
# Windows USB drivers placed in drivers/ (see drivers/README.txt) are packed
# inside every executable.
#
# The Windows job also TESTS the program: it runs the whole setup unattended on
# GitHub's fresh Windows machine (IDE, USB driver, ESP32 package, libraries,
# test compile), then "check", and saves the setup log as the "Setup-Windows-log"
# artifact. A red X on "Test" means the setup failed there; read that log.
#
# RELEASES: push a tag starting with "v" (e.g. v1.0; GitHub Desktop: History,
# right-click the commit, Create Tag, then Push origin). After all the builds
# and the Windows test pass, the "release" job publishes Setup-Mac.zip,
# Setup-Windows.exe and Setup-Linux.zip as a GitHub Release. Anyone can
# download those without a GitHub account, and these links always point at
# the newest release:
#   https://github.com/DCElfving/LED_Art_Panel/releases/latest/download/Setup-Mac.zip
#   https://github.com/DCElfving/LED_Art_Panel/releases/latest/download/Setup-Windows.exe
#   https://github.com/DCElfving/LED_Art_Panel/releases/latest/download/Setup-Linux.zip
name: Build setup executables

on:
  workflow_dispatch:
  push:
    # Branch pushes: only when the setup program changes. Tag pushes: always
    # (GitHub ignores "paths" for tags).
    branches: ["**"]
    tags: ["v*"]
    paths: [setup_panel.py, drivers/**, .github/workflows/build-setup.yml]

jobs:
  mac:
    # One "universal" program that runs natively on both Apple Silicon and
    # Intel Macs. That needs python.org's universal Python, not the runner's.
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - name: Install universal Python from python.org
        run: |
          curl -sSLo python.pkg https://www.python.org/ftp/python/3.13.9/python-3.13.9-macos11.pkg
          sudo installer -pkg python.pkg -target /
      - name: Build
        run: |
          PY=/Library/Frameworks/Python.framework/Versions/3.13/bin/python3.13
          $PY -m pip install pyinstaller==6.22.3 certifi   # certifi: trusted HTTPS certificates
          $PY -m PyInstaller --onefile --console --target-arch universal2 \
            --add-data "drivers:drivers" --name Setup-Mac setup_panel.py
          lipo -archs dist/Setup-Mac     # should print: x86_64 arm64
          ditto -c -k dist/Setup-Mac Setup-Mac.zip     # zip keeps the executable bit
      - uses: actions/upload-artifact@v4
        with:
          name: Setup-Mac
          path: Setup-Mac.zip

  windows-linux:
    strategy:
      matrix:
        include:
          - os: windows-latest
            name: Setup-Windows
          - os: ubuntu-22.04        # older glibc, so it runs on more Linux versions
            name: Setup-Linux
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install pyinstaller==6.22.3 certifi
      - run: pyinstaller --onefile --console --add-data "drivers:drivers" --name ${{ matrix.name }} setup_panel.py
      - if: runner.os == 'Linux'
        run: cd dist && zip Setup-Linux.zip Setup-Linux && rm Setup-Linux
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: dist/*

      # ---- Windows only: run the program the way a student would, unattended.
      - name: Test - full setup
        if: runner.os == 'Windows'
        run: dist\Setup-Windows.exe --yes
      - name: Test - check what was installed
        if: runner.os == 'Windows'
        run: dist\Setup-Windows.exe check
      - name: Collect the setup log
        if: always() && runner.os == 'Windows'
        run: |
          foreach ($d in "$env:USERPROFILE\OneDrive\Desktop", "$env:USERPROFILE\Desktop", "$env:USERPROFILE") {
            $log = Join-Path $d "LED Art Panel setup log.txt"
            if (Test-Path $log) { Copy-Item $log setup-log.txt; break }
          }
      - if: always() && runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: Setup-Windows-log
          path: setup-log.txt
          if-no-files-found: warn

  release:
    # Only for version tags, and only after every build and the Windows test passed.
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [mac, windows-linux]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          files="artifacts/Setup-Mac/Setup-Mac.zip artifacts/Setup-Windows/Setup-Windows.exe artifacts/Setup-Linux/Setup-Linux.zip"
          ls -l $files
          notes="Setup programs for student computers. Download the one for your computer:
          - Setup-Mac.zip: any Mac (Apple chip or Intel). Unzip, then double-click Setup-Mac.
          - Setup-Windows.exe: Windows 10/11.
          - Setup-Linux.zip: 64-bit Linux."
          # Create the release, or update it if one already exists for this tag.
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 ||
            gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --title "LED Art Panel setup $TAG" --notes "$notes"
          gh release upload "$TAG" $files --repo "$GITHUB_REPOSITORY" --clobber
